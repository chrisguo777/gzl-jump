<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>跳一跳 3D · 城市之旅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #c { position:fixed; left:0; top:0; display:block; }
  #char-el {
    position:fixed; left:0; top:0; pointer-events:none; z-index:5;
    transform-origin:50% 100%; mix-blend-mode:screen; will-change:transform;
  }
  #char-img { width:22.5px; height:auto; display:block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="char-el"><img id="char-img" src="images/gzl.png" alt=""></div>
<script>
"use strict";

// ===================== CONSTANTS =====================
const CITIES = [
  { name:'宜昌',   sky:['#1a3a5c','#2d6a8a'], glow:'#4db8d4', buildings:['#2a5f7a','#1e4a61','#3a7a8a'], ground:'#2d5a3d', accent:'#5bc8d4' },
  { name:'六盘水', sky:['#1a1a2e','#2d2d44'], glow:'#7a6a8a', buildings:['#3a3a4a','#2a2a3a','#4a3a5a'], ground:'#2a2a2a', accent:'#8a7a9a' },
  { name:'淄博',   sky:['#3a1a0a','#6a3a1a'], glow:'#ff8a3a', buildings:['#7a3a1a','#5a2a0a','#8a4a2a'], ground:'#3a2a1a', accent:'#ff6a2a' },
  { name:'深圳',   sky:['#0a1a3a','#1a3a6a'], glow:'#00d4ff', buildings:['#1a4a7a','#0a2a5a','#2a5a8a'], ground:'#1a2a1a', accent:'#00aaff' },
  { name:'广州',   sky:['#2a1a0a','#5a3a1a'], glow:'#ffcc44', buildings:['#6a4a2a','#4a3a1a','#7a5a2a'], ground:'#2a3a1a', accent:'#ffaa22' },
  { name:'重庆',   sky:['#1a0a2a','#3a1a4a'], glow:'#ff44aa', buildings:['#4a1a5a','#3a0a4a','#5a2a6a'], ground:'#1a1a2a', accent:'#ff22cc' },
  { name:'北京',   sky:['#1a0a0a','#3a1a1a'], glow:'#cc2222', buildings:['#4a1a1a','#6a2a2a','#3a0a0a'], ground:'#2a1a1a', accent:'#ffcc00' },
  { name:'上海',   sky:['#0a1a2a','#2a3a5a'], glow:'#ffaa44', buildings:['#3a4a6a','#2a3a5a','#4a5a7a'], ground:'#1a2a2a', accent:'#ffcc88' },
  { name:'首尔',   sky:['#1a0a2a','#3a1a4a'], glow:'#ff88cc', buildings:['#4a2a5a','#3a1a4a','#5a3a6a'], ground:'#2a1a3a', accent:'#ff66bb' },
  { name:'西雅图', sky:['#1a2a3a','#2a3a4a'], glow:'#88aacc', buildings:['#3a4a5a','#2a3a4a','#4a5a6a'], ground:'#2a3a2a', accent:'#aaccee' },
  { name:'洛杉矶', sky:['#3a1a0a','#6a3a2a'], glow:'#ff8844', buildings:['#5a3a2a','#7a4a3a','#4a2a1a'], ground:'#3a2a1a', accent:'#ff6622' },
  { name:'亚特兰大',sky:['#2a1a0a','#4a2a1a'], glow:'#cc8844', buildings:['#4a2a1a','#5a3a2a','#6a4a3a'], ground:'#2a1a1a', accent:'#dd9955' },
];

const DIR = {
  front: { dc:  0, dr: 1 },
  left:  { dc: -1, dr: 0 },
  right: { dc:  1, dr: 0 },
};

const BASE_TILE_W = 96, BASE_TILE_H = 48, BASE_TILE_Z = 40;

// ===================== CANVAS / SIZE =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const charEl = document.getElementById('char-el');
const charImg = document.getElementById('char-img');

let W = 0, H = 0, DPR = 1, SCALE = 1;
let TILE_W = BASE_TILE_W, TILE_H = BASE_TILE_H, TILE_Z = BASE_TILE_Z;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCALE = Math.min(W, H) / 600;
  TILE_W = BASE_TILE_W * SCALE;
  TILE_H = BASE_TILE_H * SCALE;
  TILE_Z = BASE_TILE_Z * SCALE;
  charImg.style.width = (22.5 * SCALE) + 'px';
}
window.addEventListener('resize', resize);

// ===================== HELPERS =====================
function isoX(col, row) { return (col - row) * (TILE_W / 2); }
function isoY(col, row) { return (col + row) * (TILE_H / 2); }
function camIsoX() { return isoX(camCol, camRow); }
function camIsoY() { return isoY(camCol, camRow); }

function projectToScreen(col, row) {
  return {
    x: W / 2 + isoX(col, row) - camIsoX(),
    y: H * 0.42 + isoY(col, row) - camIsoY() - TILE_Z,
  };
}

// deterministic RNG seeded by integer (Lehmer)
function seededRand(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function cityNameSeed(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 131 + name.charCodeAt(i)) % 2147483647;
  return h + 12345;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawCube(ctx, sx, sy, w, h, z, topColor, leftColor, rightColor) {
  ctx.beginPath();
  ctx.moveTo(sx,       sy);
  ctx.lineTo(sx + w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx - w/2, sy + h/2);
  ctx.closePath();
  ctx.fillStyle = topColor; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx - w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx,       sy + h + z);
  ctx.lineTo(sx - w/2, sy + h/2 + z);
  ctx.closePath();
  ctx.fillStyle = leftColor; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx + w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx,       sy + h + z);
  ctx.lineTo(sx + w/2, sy + h/2 + z);
  ctx.closePath();
  ctx.fillStyle = rightColor; ctx.fill();
}

// ===================== GAME STATE =====================
let state = 'start';        // start | ready | charge | jumping | dead
let plats = [];
let lastDir = null;
let score = 0;
let best = loadBest();
let camCol = 0, camRow = 0;

let cityIndex = 0;
let cityFade = 1;           // 0->1 fade-in of current city

let chosenDir = null;
let chargeT = 0;
let charging = false;
let deadFrames = 0;
let comboCount = 0;

let nextCityPopup = { text: '', life: 0 };

const ch = {
  col: 0, row: 0,
  screenX: 0, screenY: 0,
  jumpZ: 0, jumping: false, jumpT: 0,
  fromCol: 0, fromRow: 0, toCol: 0, toRow: 0,
  sqX: 1, sqY: 1,
  dying: false, dieFall: 0, dieVX: 0, dieVY: 0, dieZ: 0,
  willLand: null, jumpDist: 0, targetDist: 0, jumpFrames: 45,
  landImpact: 0,
};

let parts = [];
let popups = [];
let occupiedCells = new Set();

// ===================== PATH GENERATION =====================
function validDirs(ld) {
  if (ld === 'left')  return ['left', 'front'];
  if (ld === 'right') return ['right', 'front'];
  return ['left', 'front', 'right'];
}
function addPlat() {
  const last = plats[plats.length - 1];
  const dist = Math.floor(Math.random() * 4) + 2;
  const opts = validDirs(last.dir);
  const free = opts.filter(d => {
    const dd = DIR[d];
    return !occupiedCells.has((last.col + dist * dd.dc) + ',' + (last.row + dist * dd.dr));
  });
  const choices = free.length > 0 ? free : opts;
  const dir = choices[Math.floor(Math.random() * choices.length)];
  const d = DIR[dir];
  const nc = last.col + d.dc * dist, nr = last.row + d.dr * dist;
  occupiedCells.add(nc + ',' + nr);
  plats.push({ col: nc, row: nr, dir: dir, dist: dist });
}
function indexOfChar() {
  return plats.findIndex(p => p.col === ch.col && p.row === ch.row);
}
function nextDirOf() {
  const idx = indexOfChar();
  if (idx === -1) return null;
  return plats[idx + 1]?.dir ?? null;
}
function nextDistOf() {
  const idx = indexOfChar();
  if (idx === -1) return 3;
  return plats[idx + 1]?.dist ?? 3;
}
function ensureAhead() {
  while (plats.length < indexOfChar() + 7) addPlat();
}

// ===================== RESET =====================
function reset() {
  occupiedCells = new Set(['0,0']);
  plats = [{ col: 0, row: 0, dir: null, dist: 0 }];
  for (let i = 0; i < 7; i++) addPlat();
  ch.col = 0; ch.row = 0;
  ch.jumpZ = 0; ch.jumping = false; ch.jumpT = 0;
  ch.sqX = 1; ch.sqY = 1; ch.landImpact = 0;
  ch.dying = false; ch.dieFall = 0; ch.dieZ = 0; ch.dieVX = 0; ch.dieVY = 0;
  ch.willLand = null;
  camCol = ch.col; camRow = ch.row;
  lastDir = null;
  score = 0;
  cityIndex = 0; cityFade = 1;
  chosenDir = null; chargeT = 0; charging = false; deadFrames = 0;
  comboCount = 0;
  parts = [];
  popups = [];
  nextCityPopup = { text: '', life: 0 };
  state = 'start';
  charEl.style.opacity = '1';
}

// ===================== INPUT =====================
function onRelease() {
  if (state === 'charge' && charging) {
    charging = false;
    startJump();
  }
}

canvas.addEventListener('mousedown', () => {
  if (state === 'start') { state = 'ready'; }
  else if (state === 'ready') {
    chosenDir = nextDirOf() || 'front';
    state = 'charge';
    charging = true;
    chargeT = 0;
  }
  else if (state === 'dead' && deadFrames > 55) reset();
});
canvas.addEventListener('mouseup', () => {
  if (state === 'charge' && charging) onRelease();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (state === 'start') { state = 'ready'; }
  else if (state === 'ready') {
    chosenDir = nextDirOf() || 'front';
    state = 'charge';
    charging = true;
    chargeT = 0;
  }
  else if (state === 'dead' && deadFrames > 55) reset();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (state === 'charge' && charging) onRelease();
}, { passive: false });

// ===================== JUMP / DIE =====================
function startJump() {
  playSound('jump');
  const idx = indexOfChar();
  if (idx === -1) { dieJump(); return; }
  const nextP = plats[idx + 1];
  if (!nextP) { dieJump(); return; }
  const d = DIR[chosenDir];
  const actualDist = 2 + chargeT * 3;
  const targetDist = nextP.dist;
  const delta = Math.abs(actualDist - targetDist);
  const successThreshold = targetDist / 2;
  let willLand;
  if (delta <= 0.2) willLand = 'center';
  else if (delta <= successThreshold) willLand = 'normal';
  else willLand = 'miss';
  ch.fromCol = ch.col; ch.fromRow = ch.row;
  if (willLand !== 'miss') {
    ch.toCol = nextP.col;
    ch.toRow = nextP.row;
  } else {
    ch.toCol = ch.col + d.dc * actualDist;
    ch.toRow = ch.row + d.dr * actualDist;
  }
  ch.willLand = willLand;
  ch.jumpDist = actualDist;
  ch.targetDist = targetDist;
  ch.jumpFrames = Math.round(25 + Math.max(actualDist, targetDist) * 8);
  ch.jumping = true;
  ch.jumpT = 0;
  state = 'jumping';
}
function landed() {
  if (ch.willLand === 'miss') {
    dieJump();
    return;
  }
  ch.col = ch.toCol; ch.row = ch.toRow;
  ch.jumping = false; ch.jumpZ = 0; ch.jumpT = 0;
  ch.sqX = 1; ch.sqY = 1;
  ch.landImpact = 1;
  lastDir = chosenDir;
  if (ch.willLand === 'center') {
    playSound('perfect');
    comboCount++;
    const gain = Math.pow(2, Math.min(comboCount, 10));
    score += gain;
    spawnScorePopup(gain);
  } else {
    playSound('land');
    comboCount = 0;
    score += 1;
    spawnScorePopup(1);
  }
  spawnLandParts();
  const ci = Math.floor(score / 100) % CITIES.length;
  if (ci !== cityIndex) { cityIndex = ci; cityFade = 0; spawnCityTransitionPopup(CITIES[ci].name); }
  const charIdx = indexOfChar();
  if (charIdx > 3) {
    const removed = plats.splice(0, charIdx - 2);
    for (const p of removed) occupiedCells.delete(p.col + ',' + p.row);
  }
  ensureAhead();
  if (score > best) { best = score; saveBest(best); }
  chosenDir = null; chargeT = 0;
  state = 'ready';
}
function dieWrong(dir) {
  const d = DIR[dir];
  ch.jumping = false;
  ch.dying = true; ch.dieFall = 0; ch.dieZ = 0;
  ch.dieVX = isoX(d.dc, d.dr) * 0.06;
  ch.dieVY = 1;
  spawnDeathParts();
  state = 'dead'; deadFrames = 0;
}
function dieJump() {
  playSound('miss');
  ch.jumping = false;
  ch.dying = true; ch.dieFall = 0; ch.dieZ = 0;
  ch.dieVX = (Math.random() - 0.5) * 4;
  ch.dieVY = 1;
  spawnDeathParts();
  state = 'dead'; deadFrames = 0;
}

// ===================== UPDATE =====================
function update() {
  camCol += (ch.col - camCol) * 0.1;
  camRow += (ch.row - camRow) * 0.1;
  if (cityFade < 1) cityFade = Math.min(1, cityFade + 1 / 30);
  if (nextCityPopup.life > 0) nextCityPopup.life -= 0.015;
  if (state === 'charge' && charging) {
    chargeT = Math.min(1, chargeT + (1 / 60) / 1.8);
    ch.sqY = 1 - chargeT * 0.28;
    ch.sqX = 1 + chargeT * 0.2;
    if (chargeT >= 0.95) { charging = false; startJump(); }
  }
  if (state !== 'jumping' && ch.landImpact > 0) {
    ch.landImpact = Math.max(0, ch.landImpact - 1 / 10);
  }
  if (state === 'jumping' && ch.jumping) {
    const frames = ch.jumpFrames || 45;
    ch.jumpT = Math.min(1, ch.jumpT + 1 / frames);
    const t = ch.jumpT;
    ch.col = ch.fromCol + (ch.toCol - ch.fromCol) * t;
    ch.row = ch.fromRow + (ch.toRow - ch.fromRow) * t;
    ch.jumpZ = Math.sin(Math.PI * t) * TILE_Z * Math.max(ch.jumpDist || 1, ch.targetDist || 1) * 0.8;
    if (ch.jumpT >= 1) landed();
  }
  if (state === 'dead' && ch.dying) {
    deadFrames++;
    ch.dieFall += 1;
    ch.dieVY += 0.6;
    ch.dieZ += ch.dieVY;
  } else if (state === 'dead') {
    deadFrames++;
  }
  updateParts();
  updatePopups();
}

// ===================== DRAW =====================
function cur() { return CITIES[cityIndex]; }

// Recognizable skyline compositions based on each city's real landmarks.
// These are drawn locally (no hot-linked photos), so the game remains offline-ready.
function drawAuthenticSkyline(city) {
  ctx.save();
  ctx.globalAlpha = 0.82 * cityFade;
  const baseY = H * 0.54;
  const cx = W / 2 - camIsoX() * 0.035;
  const s = SCALE;

  function building(x, w, h, color, roof) {
    const left = cx + x * s, top = baseY - h * s;
    ctx.fillStyle = color;
    ctx.fillRect(left, top, w * s, h * s);
    if (roof === 'spire') {
      ctx.beginPath();
      ctx.moveTo(left, top); ctx.lineTo(left + w * s / 2, top - 30 * s); ctx.lineTo(left + w * s, top);
      ctx.closePath(); ctx.fill();
    } else if (roof === 'step') {
      ctx.fillRect(left + 5 * s, top - 12 * s, (w - 10) * s, 12 * s);
      ctx.fillRect(left + 10 * s, top - 23 * s, (w - 20) * s, 11 * s);
    } else if (roof === 'slant') {
      ctx.beginPath(); ctx.moveTo(left, top); ctx.lineTo(left + w * s, top - 18 * s);
      ctx.lineTo(left + w * s, top); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = city.accent;
    ctx.globalAlpha = 0.16 * cityFade;
    const cols = Math.max(1, Math.floor(w / 10));
    for (let yy = top + 10 * s; yy < baseY - 6 * s; yy += 14 * s) {
      for (let j = 0; j < cols; j++) if ((j + Math.floor(yy / (14 * s))) % 3 !== 0) {
        ctx.fillRect(left + (5 + j * 10) * s, yy, 3 * s, 5 * s);
      }
    }
    ctx.globalAlpha = 0.82 * cityFade;
  }
  function mountain(x, w, h, color, snow) {
    ctx.fillStyle = color; ctx.beginPath(); ctx.moveTo(cx + x * s, baseY);
    ctx.lineTo(cx + (x + w * 0.5) * s, baseY - h * s); ctx.lineTo(cx + (x + w) * s, baseY);
    ctx.closePath(); ctx.fill();
    if (snow) {
      ctx.fillStyle = 'rgba(245,250,255,0.7)'; ctx.beginPath();
      ctx.moveTo(cx + (x + w * 0.38) * s, baseY - h * 0.76 * s);
      ctx.lineTo(cx + (x + w * 0.5) * s, baseY - h * s);
      ctx.lineTo(cx + (x + w * 0.63) * s, baseY - h * 0.74 * s);
      ctx.closePath(); ctx.fill();
    }
  }
  function tower(x, bodyH, color, deckW) {
    const px = cx + x * s;
    ctx.fillStyle = color; ctx.fillRect(px - 4 * s, baseY - bodyH * s, 8 * s, bodyH * s);
    ctx.beginPath(); ctx.ellipse(px, baseY - bodyH * 0.66 * s, deckW * s, 10 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = color; ctx.lineWidth = 3 * s; ctx.beginPath();
    ctx.moveTo(px, baseY - bodyH * s); ctx.lineTo(px, baseY - (bodyH + 38) * s); ctx.stroke();
  }
  function pearlTower(x) {
    const px = cx + x * s;
    ctx.strokeStyle = '#e76aa6'; ctx.lineWidth = 6 * s; ctx.beginPath();
    ctx.moveTo(px, baseY); ctx.lineTo(px, baseY - 190 * s); ctx.stroke();
    ctx.fillStyle = '#ff87bd';
    ctx.beginPath(); ctx.arc(px, baseY - 78 * s, 18 * s, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(px, baseY - 145 * s, 13 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#ffd1e6'; ctx.lineWidth = 2 * s; ctx.beginPath();
    ctx.moveTo(px, baseY - 190 * s); ctx.lineTo(px, baseY - 224 * s); ctx.stroke();
  }
  function cantonTower(x) {
    const px = cx + x * s;
    ctx.strokeStyle = '#ff6699'; ctx.lineWidth = 3 * s;
    ctx.beginPath(); ctx.moveTo(px - 18 * s, baseY); ctx.bezierCurveTo(px + 5 * s, baseY - 80 * s, px - 5 * s, baseY - 150 * s, px - 10 * s, baseY - 205 * s); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + 18 * s, baseY); ctx.bezierCurveTo(px - 5 * s, baseY - 80 * s, px + 5 * s, baseY - 150 * s, px + 10 * s, baseY - 205 * s); ctx.stroke();
    ctx.lineWidth = 1 * s;
    for (let y = 0; y < 190; y += 16) { ctx.beginPath(); ctx.moveTo(px - (18 - y * 0.04) * s, baseY - y * s); ctx.lineTo(px + (18 - y * 0.04) * s, baseY - (y + 14) * s); ctx.stroke(); }
    ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(px, baseY - 205 * s); ctx.lineTo(px, baseY - 245 * s); ctx.stroke();
  }
  function baseline() {
    ctx.fillStyle = 'rgba(5,10,16,0.72)';
    ctx.fillRect(0, baseY, W, 34 * s);
  }

  if (city.name === '宜昌') {
    mountain(-W / s * 0.58, W / s * 0.45, 145, '#31566b');
    mountain(-90, 290, 175, '#426d7d');
    ctx.fillStyle = '#929ba0'; ctx.fillRect(cx - 180 * s, baseY - 52 * s, 360 * s, 52 * s);
    ctx.fillStyle = '#26343a'; for (let i = 0; i < 12; i++) ctx.fillRect(cx + (-165 + i * 29) * s, baseY - 45 * s, 11 * s, 38 * s);
    ctx.fillStyle = 'rgba(210,245,255,0.76)'; for (let i = 0; i < 11; i++) ctx.fillRect(cx + (-154 + i * 29) * s, baseY - 8 * s, 15 * s, 28 * s);
  } else if (city.name === '六盘水') {
    mountain(-W / s * 0.58, 280, 190, '#453e51'); mountain(-120, 260, 225, '#564b61'); mountain(70, 300, 180, '#403947');
    building(-145, 30, 70, '#343844'); building(-105, 46, 92, '#3d424d'); building(-50, 38, 64, '#353b45'); building(0, 58, 110, '#424854'); building(70, 42, 76, '#363c47');
    ctx.fillStyle = '#242832'; for (const x of [-128,-70,88]) ctx.fillRect(cx + x * s, baseY - 125 * s, 8 * s, 80 * s);
  } else if (city.name === '淄博') {
    building(-170, 48, 86, '#67372d','step'); building(-110, 62, 112, '#7a4032'); building(-34, 70, 142, '#884632','step'); building(52, 55, 98, '#703a2e'); building(120, 42, 76, '#60342c');
    ctx.strokeStyle = '#ff8a3a'; ctx.lineWidth = 7 * s; ctx.beginPath(); ctx.arc(cx + 15 * s, baseY - 28 * s, 70 * s, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#3d2722'; ctx.fillRect(cx - 58 * s, baseY - 29 * s, 146 * s, 29 * s);
  } else if (city.name === '深圳') {
    building(-190, 44, 105, '#123d63'); building(-134, 48, 148, '#175078','slant');

function drawBg(city) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, city.sky[0]);
  g.addColorStop(1, city.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const horizon = H * 0.5;
  const gg = ctx.createLinearGradient(0, horizon - 80 * SCALE, 0, horizon + 80 * SCALE);
  gg.addColorStop(0, 'rgba(0,0,0,0)');
  gg.addColorStop(0.5, city.glow);
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.25 * cityFade;
  ctx.fillStyle = gg; ctx.fillRect(0, horizon - 80 * SCALE, W, 160 * SCALE);
  ctx.globalAlpha = 1;
  drawAuthenticSkyline(city);
  ctx.save();
  ctx.globalAlpha = 0.10 * cityFade;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 ' + (110 * SCALE) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(city.name, W / 2, H * 0.22);
  ctx.restore();
  const gs = ctx.createLinearGradient(0, H * 0.75, 0, H);
  gs.addColorStop(0, 'rgba(0,0,0,0)');
  gs.addColorStop(1, city.ground);
  ctx.fillStyle = gs; ctx.fillRect(0, H * 0.75, W, H * 0.25);
}

function drawScene(city) {
  const list = [];
  for (const p of plats) list.push({ depth: p.col + p.row, kind: 'plat', p: p });
  list.push({ depth: ch.col + ch.row + 0.01, kind: 'char' });
  list.sort((a, b) => a.depth - b.depth);
  const idx = indexOfChar();
  const nextP = plats[idx + 1];
  for (const item of list) {
    if (item.kind === 'plat') {
      const p = item.p;
      const s = projectToScreen(p.col, p.row);
      if (s.x < -TILE_W * 2 || s.x > W + TILE_W * 2 || s.y < -TILE_Z * 6 || s.y > H + TILE_Z * 3) continue;
      const top = city.ground;
      drawCube(ctx, s.x, s.y - TILE_H / 2, TILE_W, TILE_H, TILE_Z, top, shade(top, -28), shade(top, -52));
      if (state === 'ready' && p === nextP) {
        ctx.save();
        ctx.globalAlpha = 0.45 + 0.25 * Math.sin(Date.now() / 250);
        ctx.strokeStyle = city.accent; ctx.lineWidth = 3 * SCALE;
        const sy = s.y - TILE_H / 2;
        ctx.beginPath();
        ctx.moveTo(s.x, sy);
        ctx.lineTo(s.x + TILE_W/2, sy + TILE_H/2);
        ctx.lineTo(s.x, sy + TILE_H);
        ctx.lineTo(s.x - TILE_W/2, sy + TILE_H/2);
        ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    } else {
      const s = projectToScreen(ch.col, ch.row);
      let py = s.y - ch.jumpZ;
      if (ch.dying) {
        py += ch.dieZ;
      }

      // 阴影随跳跃高度缩小、变淡，强化腾空感
      const shadowLift = Math.max(0, Math.min(1, ch.jumpZ / Math.max(TILE_Z * 3, 1)));
      const shadowScale = 1 - shadowLift * 0.38;
      ctx.save();
      ctx.globalAlpha = ch.dying ? 0 : 0.27 * (1 - shadowLift * 0.62);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(
        s.x,
        s.y - TILE_H / 2,
        TILE_W * 0.3 * shadowScale,
        TILE_H * 0.2 * shadowScale,
        0, 0, Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // 绘制3D人物
      let scaleX = 1, scaleY = 1;
      if (state === 'charge') {
        scaleX = ch.sqX;
        scaleY = ch.sqY;
      }
      drawCharacter3D(s.x + (ch.dying ? ch.dieVX * ch.dieFall : 0), py, 0, scaleX, scaleY);
    }
  }
  drawParts();
  drawPopups();
}

function drawCharacter3D(sx, sy, sz, scaleX, scaleY) {
  if (!charImg.complete) return;

  const imgW = charImg.width || 45 * SCALE;
  const imgH = charImg.height || 45 * SCALE;
  let finalScaleX = scaleX, finalScaleY = scaleY;
  let flipAngle = 0;

  if (state === 'jumping') {
    const t = Math.max(0, Math.min(1, ch.jumpT));
    // smoothstep 让起跳和落地阶段更稳，中段翻转更利落
    const flipProgress = t * t * (3 - 2 * t);
    const screenTravelX = isoX(ch.toCol - ch.fromCol, ch.toRow - ch.fromRow);
    const flipDirection = screenTravelX >= 0 ? 1 : -1;
    flipAngle = flipDirection * Math.PI * 2 * flipProgress;

    // 空中收身，落地前重新伸展
    const tuck = Math.sin(Math.PI * t);
    finalScaleX *= 1 + tuck * 0.10;
    finalScaleY *= 1 - tuck * 0.12;
  } else if (ch.landImpact > 0) {
    // 落地短暂压缩，随后快速恢复
    finalScaleX *= 1 + ch.landImpact * 0.16;
    finalScaleY *= 1 - ch.landImpact * 0.16;
  }

  ctx.save();
  ctx.translate(sx, sy);

  // 应用 isometric 透视变换，保持角色与场景方向一致
  const isoPerspective = 0.85;
  ctx.transform(1, 0.25 * isoPerspective, 0.25 * isoPerspective, 0.95, 0, 0);

  // 将旋转中心移到身体中央，完成一整周前空翻
  ctx.translate(0, -imgH * 0.5);
  if (state === 'jumping') ctx.rotate(flipAngle);
  ctx.scale(finalScaleX, finalScaleY);

  // 图片围绕身体中心绘制，避免以前脚底为轴产生“甩圈”感
  ctx.drawImage(charImg, -imgW / 2, -imgH / 2, imgW, imgH);

  if (state === 'charge') {
    ctx.globalAlpha = Math.min(chargeT * 0.3, 0.15);
    ctx.fillStyle = '#ffff99';
    ctx.beginPath();
    ctx.arc(0, 0, imgW * 0.6, 0, Math.PI * 2);
    ctx.fill();
  } else if (ch.dying) {
    ctx.globalAlpha = 0.6;
    ctx.strokeStyle = '#ff4444';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-imgW * 0.3, -imgH * 0.2);
    ctx.lineTo(imgW * 0.3, imgH * 0.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(imgW * 0.3, -imgH * 0.2);
    ctx.lineTo(-imgW * 0.3, imgH * 0.2);
    ctx.stroke();
  }

  ctx.restore();
}

function spawnCityTransitionPopup(cityName) {
  nextCityPopup = { text: '到达 ' + cityName, life: 1.0 };
}

function drawCityTransitionPopup() {
  if (nextCityPopup.life <= 0) return;
  ctx.save();
  ctx.globalAlpha = nextCityPopup.life;
  ctx.fillStyle = '#ffcc00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (32 * SCALE) + 'px sans-serif';
  ctx.fillText(nextCityPopup.text, W / 2, H * 0.25);
  ctx.restore();
}

function drawUI(city) {
  ctx.save();
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + (34 * SCALE) + 'px sans-serif';
  ctx.fillText(String(score), W - 20, 18);
  ctx.font = '600 ' + (16 * SCALE) + 'px sans-serif';
  ctx.fillStyle = city.accent;
  ctx.fillText(city.name + '  ·  最高 ' + best, W - 20, 18 + 40 * SCALE);
  if (comboCount > 0) {
    ctx.font = '700 ' + (18 * SCALE) + 'px sans-serif';
    ctx.fillStyle = '#ffd700';
    const nextGain = Math.pow(2, Math.min(comboCount + 1, 10));
    ctx.fillText('连击 ×' + comboCount + '  下次 +' + nextGain, W - 20, 18 + 64 * SCALE);
  }
  ctx.restore();
  if (state === 'charge') {
    const bw = Math.min(W * 0.6, 320 * SCALE);
    const bx = (W - bw) / 2, by = H - 110 * SCALE, bh = 12 * SCALE;
    const nextDist = nextDistOf();
    const tgt = (nextDist - 2) / 3;
    const successHalf = 0.5 / 3;
    const centerHalf  = 0.2 / 3;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    const szL = Math.max(0, tgt - successHalf);
    const szR = Math.min(1, tgt + successHalf);
    ctx.fillStyle = 'rgba(80,255,140,.35)';
    ctx.fillRect(bx + bw * szL, by, bw * (szR - szL), bh);
    const czL = Math.max(0, tgt - centerHalf);
    const czR = Math.min(1, tgt + centerHalf);
    ctx.fillStyle = 'rgba(255,215,0,.55)';
    ctx.fillRect(bx + bw * czL, by, bw * (czR - czL), bh);
    const delta = Math.abs(chargeT - tgt);
    let fillColor;
    if (delta <= centerHalf) fillColor = '#ffd700';
    else if (delta <= successHalf) fillColor = '#5fffb0';
    else fillColor = '#ff7a7a';
    roundRect(bx, by, Math.max(bh, bw * chargeT), bh, bh / 2);
    ctx.fillStyle = fillColor; ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * SCALE;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(bx + bw * tgt, by - 3 * SCALE);
    ctx.lineTo(bx + bw * tgt, by + bh + 3 * SCALE);
    ctx.stroke();
    ctx.restore();
  }
  if (state === 'start') {
    overlay();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '700 ' + (44 * SCALE) + 'px sans-serif';
    ctx.fillText('跳一跳 · 城市之旅', W / 2, H * 0.40);
    ctx.font = '500 ' + (20 * SCALE) + 'px sans-serif';
    ctx.fillStyle = '#cde';
    ctx.fillText('点击任意处开始', W / 2, H * 0.40 + 50 * SCALE);
    ctx.fillText('按住蓄力 → 松手起跳', W / 2, H * 0.40 + 84 * SCALE);
  }
  if (state === 'dead') {
    overlay();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '700 ' + (48 * SCALE) + 'px sans-serif';
    ctx.fillText('GAME OVER', W / 2, H * 0.38);
    ctx.font = '600 ' + (26 * SCALE) + 'px sans-serif';
    ctx.fillText('得分 ' + score + '   最高 ' + best, W / 2, H * 0.38 + 50 * SCALE);
    if (deadFrames > 55) {
      ctx.font = '500 ' + (20 * SCALE) + 'px sans-serif';
      ctx.fillStyle = '#cde';
      ctx.fillText('点击重新开始', W / 2, H * 0.38 + 96 * SCALE);
    }
  }
}
function overlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ===================== PARTICLES =====================
function spawnLandParts() {
  const s = projectToScreen(ch.toCol, ch.toRow);
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 3) * SCALE;
    parts.push({ x: s.x, y: s.y - TILE_H / 2, vx: Math.cos(a) * sp, vy: -Math.abs(Math.sin(a) * sp) - 1,
      life: 1, color: cur().accent, size: (3 + Math.random() * 3) * SCALE });
  }
}
function spawnDeathParts() {
  const s = projectToScreen(ch.col, ch.row);
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 5) * SCALE;
    parts.push({ x: s.x, y: s.y - 20 * SCALE, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      life: 1, color: '#ff6a6a', size: (3 + Math.random() * 4) * SCALE });
  }
}
function spawnScorePopup(gain) {
  const s = projectToScreen(ch.toCol, ch.toRow);
  popups.push({
    x: s.x,
    y: s.y - TILE_Z * 2,
    vy: -1.8 * SCALE,
    life: 1.0,
    text: '+' + gain,
    color: gain > 1 ? '#ffd700' : '#ffffff',
  });
}
function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.18 * SCALE; p.life -= 0.025; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function updatePopups() {
  for (const p of popups) { p.y += p.vy; p.life -= 0.022; }
  popups = popups.filter(p => p.life > 0);
}
function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (22 * SCALE) + 'px sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ===================== STORAGE =====================
function loadBest() { try { return parseInt(localStorage.getItem('jump3d_best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('jump3d_best', String(v)); } catch (e) {} }

// ===================== SOUND =====================
function playSound(type) {
  try {
    const audioCtx = window.audioCtx || (window.audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'jump') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'perfect') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.frequency.setValueAtTime(500, now);
      osc2.frequency.setValueAtTime(750, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.3);
      osc2.stop(now + 0.3);
    } else if (type === 'land') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'miss') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  } catch (e) {}
}

// ===================== MAIN LOOP =====================
function draw() {
  ctx.clearRect(0, 0, W, H);
  const city = cur();
  drawBg(city);
  drawScene(city);
  drawUI(city);
  drawCityTransitionPopup();
}
function tick() {
  update();
  draw();
  requestAnimationFrame(tick);
}

// ===================== INIT =====================
resize();
reset();
tick();
</script>
