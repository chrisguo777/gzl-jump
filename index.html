<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:8765; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>跳一跳 3D · 城市之旅</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"PingFang SC","Microsoft YaHei",sans-serif; -webkit-tap-highlight-color:transparent;
    user-select:none; -webkit-user-select:none; touch-action:none; }
  #c { position:fixed; left:0; top:0; display:block; z-index:0; }
  #character-3d {
    position:fixed; left:0; top:0; width:100%; height:100%;
    display:block; pointer-events:none; z-index:2;
  }
  #char-el {
    position:fixed; left:0; top:0; pointer-events:none; z-index:5;
    transform-origin:50% 100%; mix-blend-mode:screen; will-change:transform;
    display:none;
  }
  #char-img { width:22.5px; height:auto; display:block; }
  #companion-toggle {
    position:fixed; top:18px; right:18px; z-index:30;
    min-width:82px; height:40px; padding:0 16px; border:1px solid rgba(255,255,255,.32);
    border-radius:22px; color:#fff; background:rgba(8,16,29,.62);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font:600 14px/1 "PingFang SC","Microsoft YaHei",sans-serif;
    box-shadow:0 8px 28px rgba(0,0,0,.24); cursor:pointer;
  }
  #companion-toggle:hover { background:rgba(18,33,54,.78); }
  #companion-panel {
    position:fixed; top:68px; right:18px; z-index:31; width:min(370px,calc(100vw - 36px));
    height:min(520px,calc(100vh - 92px)); display:none; flex-direction:column;
    border:1px solid rgba(255,255,255,.22); border-radius:22px; overflow:hidden;
    color:#f6f8ff; background:linear-gradient(155deg,rgba(14,25,43,.94),rgba(35,24,46,.92));
    backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
    box-shadow:0 22px 70px rgba(0,0,0,.46); user-select:text; -webkit-user-select:text;
  }
  #companion-panel { touch-action:pan-y; }
  #companion-messages { overscroll-behavior:contain; touch-action:pan-y; }
  #companion-input:focus-visible, #companion-panel button:focus-visible { outline:2px solid #ffb3df; outline-offset:2px; }
  #companion-retry { margin:0 12px 10px; padding:8px; border-radius:10px; }
  #companion-panel.open { display:flex; }
  .companion-head { display:flex; align-items:center; gap:11px; padding:15px 16px 12px; border-bottom:1px solid rgba(255,255,255,.12); }
  .companion-avatar { width:35px; height:35px; border-radius:50%; object-fit:cover; border:1px solid rgba(255,255,255,.45); }
  .companion-title { flex:1; min-width:0; }
  .companion-title strong { display:block; font-size:15px; }
  .companion-title span { display:block; margin-top:3px; color:rgba(235,240,255,.62); font-size:11px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #companion-close { border:0; color:#fff; background:transparent; font-size:25px; line-height:1; cursor:pointer; opacity:.7; }
  #companion-messages { flex:1; min-height:0; padding:14px; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .companion-message { max-width:84%; padding:9px 12px; border-radius:15px; font-size:14px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
  .companion-message.ai { align-self:flex-start; background:rgba(255,255,255,.13); border-bottom-left-radius:5px; }
  .companion-message.user { align-self:flex-end; background:linear-gradient(135deg,#ee789f,#b56ce6); border-bottom-right-radius:5px; }
  .companion-message.system { align-self:center; max-width:95%; color:rgba(235,240,255,.68); background:transparent; text-align:center; font-size:12px; }
  .companion-input-row { display:flex; gap:8px; padding:12px; border-top:1px solid rgba(255,255,255,.12); }
  #companion-input { flex:1; min-width:0; height:40px; padding:0 13px; border:1px solid rgba(255,255,255,.18); border-radius:14px; outline:none; color:#fff; background:rgba(255,255,255,.08); font:14px "PingFang SC","Microsoft YaHei",sans-serif; }
  #companion-input::placeholder { color:rgba(235,240,255,.45); }
  #companion-send { width:58px; border:0; border-radius:14px; color:#fff; background:linear-gradient(135deg,#ee789f,#9b67dc); font-weight:700; cursor:pointer; }
  #companion-send:disabled { opacity:.46; cursor:wait; }
  @media (max-width:600px) {
    #companion-toggle { top:12px; right:12px; height:38px; }
    #companion-panel { top:58px; right:10px; width:calc(100vw - 20px); height:min(440px,60dvh); }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="character-3d" aria-hidden="true"></canvas>
<div id="char-el"><img id="char-img" src="images/gzl.png" alt=""></div>
<button id="companion-toggle" type="button" aria-controls="companion-panel" aria-expanded="false">♡ 对话</button>
<section id="companion-panel" role="dialog" aria-label="游戏陪伴角色对话">
  <div class="companion-head">
    <img class="companion-avatar" src="images/gzl.png" alt="">
    <div class="companion-title"><strong id="companion-name">旅伴</strong><span>AI 游戏角色 · 不是真人本人</span></div>
    <button id="companion-close" type="button" aria-label="关闭">×</button>
  </div>
  <div id="companion-messages" role="log" aria-live="polite">
    <div class="companion-message ai">我会陪你一起旅行。等本地记忆准备好后，我们就能聊起属于你们的故事。</div>
  </div>
  <form id="companion-form" class="companion-input-row">
    <input id="companion-input" aria-label="给 AI 游戏角色的消息" autocomplete="off" maxlength="500" placeholder="说点什么…">
    <button id="companion-send" type="submit">发送</button>
  </form>
  <button id="companion-retry" type="button" hidden>重试上一条</button>
</section>
<script src="vendor/three.min.js"></script>
<script>
"use strict";

// ===================== CONSTANTS =====================
const CITIES = [
  { name:'宜昌',   sky:['#1a3a5c','#2d6a8a'], glow:'#4db8d4', buildings:['#2a5f7a','#1e4a61','#3a7a8a'], ground:'#2d5a3d', accent:'#5bc8d4' },
  { name:'六盘水', sky:['#1a1a2e','#2d2d44'], glow:'#7a6a8a', buildings:['#3a3a4a','#2a2a3a','#4a3a5a'], ground:'#2a2a2a', accent:'#8a7a9a' },
  { name:'淄博',   sky:['#3a1a0a','#6a3a1a'], glow:'#ff8a3a', buildings:['#7a3a1a','#5a2a0a','#8a4a2a'], ground:'#3a2a1a', accent:'#ff6a2a' },
  { name:'深圳',   sky:['#0a1a3a','#1a3a6a'], glow:'#00d4ff', buildings:['#1a4a7a','#0a2a5a','#2a5a8a'], ground:'#1a2a1a', accent:'#00aaff' },
  { name:'广州',   sky:['#2a1a0a','#5a3a1a'], glow:'#ffcc44', buildings:['#6a4a2a','#4a3a1a','#7a5a2a'], ground:'#2a3a1a', accent:'#ffaa22' },
  { name:'重庆',   sky:['#1a0a2a','#3a1a4a'], glow:'#ff44aa', buildings:['#4a1a5a','#3a0a4a','#5a2a6a'], ground:'#1a1a2a', accent:'#ff22cc' },
  { name:'北京',   sky:['#1a0a0a','#3a1a1a'], glow:'#cc2222', buildings:['#4a1a1a','#6a2a2a','#3a0a0a'], ground:'#2a1a1a', accent:'#ffcc00' },
  { name:'上海',   sky:['#0a1a2a','#2a3a5a'], glow:'#ffaa44', buildings:['#3a4a6a','#2a3a5a','#4a5a7a'], ground:'#1a2a2a', accent:'#ffcc88' },
  { name:'首尔',   sky:['#1a0a2a','#3a1a4a'], glow:'#ff88cc', buildings:['#4a2a5a','#3a1a4a','#5a3a6a'], ground:'#2a1a3a', accent:'#ff66bb' },
  { name:'西雅图', sky:['#1a2a3a','#2a3a4a'], glow:'#88aacc', buildings:['#3a4a5a','#2a3a4a','#4a5a6a'], ground:'#2a3a2a', accent:'#aaccee' },
  { name:'洛杉矶', sky:['#3a1a0a','#6a3a2a'], glow:'#ff8844', buildings:['#5a3a2a','#7a4a3a','#4a2a1a'], ground:'#3a2a1a', accent:'#ff6622' },
  { name:'亚特兰大',sky:['#2a1a0a','#4a2a1a'], glow:'#cc8844', buildings:['#4a2a1a','#5a3a2a','#6a4a3a'], ground:'#2a1a1a', accent:'#dd9955' },
];

const DIR = {
  front: { dc:  0, dr: 1 },
  left:  { dc: -1, dr: 0 },
  right: { dc:  1, dr: 0 },
};

const BASE_TILE_W = 96, BASE_TILE_H = 48, BASE_TILE_Z = 40;
const WORLD_ZOOM = 1.45;
const CHARACTER_MODEL_HEIGHT = 58;

// ===================== CANVAS / SIZE =====================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const charEl = document.getElementById('char-el');
const charImg = document.getElementById('char-img');
const character3DCanvas = document.getElementById('character-3d');
const companionToggle = document.getElementById('companion-toggle');
const companionPanel = document.getElementById('companion-panel');
const companionClose = document.getElementById('companion-close');
const companionForm = document.getElementById('companion-form');
const companionInput = document.getElementById('companion-input');
const companionSend = document.getElementById('companion-send');
const companionMessages = document.getElementById('companion-messages');
const companionName = document.getElementById('companion-name');

// Privacy boundary: only this loopback API is permitted by code and CSP.
const COMPANION_ENDPOINT = 'http://127.0.0.1:8765/api/chat';
const companionRetry = document.getElementById('companion-retry');
let companionFailed = '';
const companionHistory = [];
let companionBusy = false;

function setCompanionOpen(open) {
  companionPanel.classList.toggle('open', open);
  companionToggle.setAttribute('aria-expanded', String(open));
  if (open && state === 'charge') { charging = false; chargeT = 0; state = 'ready'; }
  if (open) companionInput.focus();
  else companionToggle.focus();
}

function appendCompanionMessage(text, kind) {
  const bubble = document.createElement('div');
  bubble.className = 'companion-message ' + kind;
  bubble.textContent = text;
  companionMessages.appendChild(bubble);
  while (companionMessages.children.length > 40) companionMessages.firstElementChild.remove();
  companionMessages.scrollTop = companionMessages.scrollHeight;
  return bubble;
}

async function sendCompanionMessage(message, retry = false) {
  if (companionBusy || !message.trim()) return;
  companionBusy = true;
  companionSend.disabled = true;
  companionRetry.hidden = true;
  companionForm.setAttribute('aria-busy', 'true');
  if (!retry) appendCompanionMessage(message, 'user');
  const pending = appendCompanionMessage('正在想…', 'system');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 185000);
  try {
    if (!['127.0.0.1', 'localhost'].includes(location.hostname) || location.protocol !== 'http:') {
      throw new Error('请用本机安全预览启动游戏后再对话。');
    }
    const response = await fetch(COMPANION_ENDPOINT, {
      method:'POST', headers:{ 'Content-Type':'application/json' },
      body:JSON.stringify({ message, history:companionHistory.slice(-8) }),
      signal:controller.signal, credentials:'omit', redirect:'error', cache:'no-store',
    });
    if (!response.ok) throw new Error('本地服务暂不可用，请检查 Ollama 后重试。');
    const data = await response.json();
    if (typeof data.reply !== 'string') throw new Error('回复格式错误，请重试。');
    pending.remove();
    if (typeof data.display_name === 'string') companionName.textContent = data.display_name.slice(0,40);
    const reply = data.reply.slice(0,1200);
    appendCompanionMessage(reply, 'ai');
    companionHistory.push({role:'user',content:message}, {role:'assistant',content:reply});
    companionHistory.splice(0, Math.max(0, companionHistory.length-8));
    companionFailed = '';
  } catch (error) {
    pending.textContent = error instanceof TypeError ? '本地服务未启动，请运行启动脚本后重试。' :
      error.name === 'AbortError' ? '等待超时，请稍后重试。' : error.message;
    companionFailed = message;
    companionRetry.hidden = false;
  } finally {
    clearTimeout(timeout);
    companionBusy = false;
    companionSend.disabled = false;
    companionForm.setAttribute('aria-busy', 'false');
  }
}

companionToggle.addEventListener('click', () => setCompanionOpen(!companionPanel.classList.contains('open')));
companionClose.addEventListener('click', () => setCompanionOpen(false));
companionRetry.addEventListener('click', () => sendCompanionMessage(companionFailed, true));
companionPanel.addEventListener('keydown', event => {
  if (event.key === 'Escape') { event.preventDefault(); setCompanionOpen(false); }
  event.stopPropagation();
});
companionInput.addEventListener('keydown', event => {
  if (event.key === 'Enter' && event.isComposing) event.preventDefault();
});
for (const eventName of ['mousedown','mouseup','touchstart','touchend','pointerdown','pointerup']) {
  companionPanel.addEventListener(eventName, event => event.stopPropagation());
}
companionForm.addEventListener('submit', event => {
  event.preventDefault();
  if (companionBusy) return;
  const message = companionInput.value.trim();
  if (!message) return;
  companionInput.value = '';
  sendCompanionMessage(message);
});

let renderer3D = null, scene3D = null, camera3D = null;
let characterRoot3D = null, flipPivot3D = null, modelGroup3D = null;
let characterRig3D = null, character3DReady = false;
const characterPose3D = { visible:false, sx:0, sy:0, scaleX:1, scaleY:1 };

let W = 0, H = 0, DPR = 1, SCALE = 1, WORLD_SCALE = 1;
let TILE_W = BASE_TILE_W, TILE_H = BASE_TILE_H, TILE_Z = BASE_TILE_Z;
let jumpCameraY = 0;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCALE = Math.min(W, H) / 600;
  WORLD_SCALE = SCALE * WORLD_ZOOM;
  TILE_W = BASE_TILE_W * WORLD_SCALE;
  TILE_H = BASE_TILE_H * WORLD_SCALE;
  TILE_Z = BASE_TILE_Z * WORLD_SCALE;
  charImg.style.width = (22.5 * WORLD_SCALE) + 'px';
  if (renderer3D && camera3D) {
    renderer3D.setPixelRatio(DPR);
    renderer3D.setSize(W, H, false);
    camera3D.left = -W / 2;
    camera3D.right = W / 2;
    camera3D.top = H / 2;
    camera3D.bottom = -H / 2;
    camera3D.updateProjectionMatrix();
  }
}
window.addEventListener('resize', resize);

// ===================== HELPERS =====================
function isoX(col, row) { return (col - row) * (TILE_W / 2); }
function isoY(col, row) { return (col + row) * (TILE_H / 2); }
function camIsoX() { return isoX(camCol, camRow); }
function camIsoY() { return isoY(camCol, camRow); }

function projectToScreen(col, row) {
  return {
    x: W / 2 + isoX(col, row) - camIsoX(),
    y: H * 0.42 + isoY(col, row) - camIsoY() - TILE_Z + jumpCameraY,
  };
}

// deterministic RNG seeded by integer (Lehmer)
function seededRand(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return function () {
    s = (s * 16807) % 2147483647;
    return (s - 1) / 2147483646;
  };
}
function cityNameSeed(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 131 + name.charCodeAt(i)) % 2147483647;
  return h + 12345;
}
function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  r = Math.max(0, Math.min(255, r + amt));
  g = Math.max(0, Math.min(255, g + amt));
  b = Math.max(0, Math.min(255, b + amt));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function drawCube(ctx, sx, sy, w, h, z, topColor, leftColor, rightColor) {
  ctx.beginPath();
  ctx.moveTo(sx,       sy);
  ctx.lineTo(sx + w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx - w/2, sy + h/2);
  ctx.closePath();
  ctx.fillStyle = topColor; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx - w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx,       sy + h + z);
  ctx.lineTo(sx - w/2, sy + h/2 + z);
  ctx.closePath();
  ctx.fillStyle = leftColor; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx + w/2, sy + h/2);
  ctx.lineTo(sx,       sy + h);
  ctx.lineTo(sx,       sy + h + z);
  ctx.lineTo(sx + w/2, sy + h/2 + z);
  ctx.closePath();
  ctx.fillStyle = rightColor; ctx.fill();
}

// ===================== GAME STATE =====================
let state = 'start';        // start | ready | charge | jumping | dead
let plats = [];
let lastDir = null;
let score = 0;
let best = loadBest();
let camCol = 0, camRow = 0;

let cityIndex = 0;
let cityFade = 1;           // 0->1 fade-in of current city

let chosenDir = null;
let chargeT = 0;
let charging = false;
let deadFrames = 0;
let comboCount = 0;

let nextCityPopup = { text: '', life: 0 };

const ch = {
  col: 0, row: 0,
  screenX: 0, screenY: 0,
  jumpZ: 0, jumping: false, jumpT: 0,
  fromCol: 0, fromRow: 0, toCol: 0, toRow: 0,
  sqX: 1, sqY: 1,
  dying: false, dieFall: 0, dieVX: 0, dieVY: 0, dieZ: 0,
  willLand: null, jumpDist: 0, targetDist: 0, jumpFrames: 45,
  landImpact: 0,
};

let parts = [];
let popups = [];
let occupiedCells = new Set();

// ===================== PATH GENERATION =====================
function validDirs(ld) {
  if (ld === 'left')  return ['left', 'front'];
  if (ld === 'right') return ['right', 'front'];
  return ['left', 'front', 'right'];
}
function addPlat() {
  const last = plats[plats.length - 1];
  const dist = Math.floor(Math.random() * 4) + 2;
  const opts = validDirs(last.dir);
  const free = opts.filter(d => {
    const dd = DIR[d];
    return !occupiedCells.has((last.col + dist * dd.dc) + ',' + (last.row + dist * dd.dr));
  });
  const choices = free.length > 0 ? free : opts;
  const dir = choices[Math.floor(Math.random() * choices.length)];
  const d = DIR[dir];
  const nc = last.col + d.dc * dist, nr = last.row + d.dr * dist;
  occupiedCells.add(nc + ',' + nr);
  plats.push({ col: nc, row: nr, dir: dir, dist: dist });
}
function indexOfChar() {
  return plats.findIndex(p => p.col === ch.col && p.row === ch.row);
}
function nextDirOf() {
  const idx = indexOfChar();
  if (idx === -1) return null;
  return plats[idx + 1]?.dir ?? null;
}
function nextDistOf() {
  const idx = indexOfChar();
  if (idx === -1) return 3;
  return plats[idx + 1]?.dist ?? 3;
}
function ensureAhead() {
  while (plats.length < indexOfChar() + 6) addPlat();
}

// ===================== RESET =====================
function reset() {
  occupiedCells = new Set(['0,0']);
  plats = [{ col: 0, row: 0, dir: null, dist: 0 }];
  for (let i = 0; i < 5; i++) addPlat();
  ch.col = 0; ch.row = 0;
  ch.jumpZ = 0; ch.jumping = false; ch.jumpT = 0;
  ch.sqX = 1; ch.sqY = 1; ch.landImpact = 0;
  ch.dying = false; ch.dieFall = 0; ch.dieZ = 0; ch.dieVX = 0; ch.dieVY = 0;
  ch.willLand = null;
  camCol = ch.col; camRow = ch.row;
  jumpCameraY = 0;
  lastDir = null;
  score = 0;
  cityIndex = 0; cityFade = 1;
  chosenDir = null; chargeT = 0; charging = false; deadFrames = 0;
  comboCount = 0;
  parts = [];
  popups = [];
  nextCityPopup = { text: '', life: 0 };
  state = 'start';
  charEl.style.opacity = '1';
}

// ===================== INPUT =====================
function onRelease() {
  if (state === 'charge' && charging) {
    charging = false;
    startJump();
  }
}

canvas.addEventListener('mousedown', () => {
  if (companionPanel.classList.contains('open')) return;
  if (state === 'start') { state = 'ready'; }
  else if (state === 'ready') {
    chosenDir = nextDirOf() || 'front';
    state = 'charge';
    charging = true;
    chargeT = 0;
  }
  else if (state === 'dead' && deadFrames > 55) reset();
});
canvas.addEventListener('mouseup', () => {
  if (state === 'charge' && charging) onRelease();
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (companionPanel.classList.contains('open')) return;
  if (state === 'start') { state = 'ready'; }
  else if (state === 'ready') {
    chosenDir = nextDirOf() || 'front';
    state = 'charge';
    charging = true;
    chargeT = 0;
  }
  else if (state === 'dead' && deadFrames > 55) reset();
}, { passive: false });
canvas.addEventListener('touchend', e => {
  e.preventDefault();
  if (state === 'charge' && charging) onRelease();
}, { passive: false });

// ===================== JUMP / DIE =====================
function startJump() {
  playSound('jump');
  const idx = indexOfChar();
  if (idx === -1) { dieJump(); return; }
  const nextP = plats[idx + 1];
  if (!nextP) { dieJump(); return; }
  const d = DIR[chosenDir];
  const actualDist = 2 + chargeT * 3;
  const targetDist = nextP.dist;
  const delta = Math.abs(actualDist - targetDist);
  const successThreshold = targetDist / 2;
  let willLand;
  if (delta <= 0.2) willLand = 'center';
  else if (delta <= successThreshold) willLand = 'normal';
  else willLand = 'miss';
  ch.fromCol = ch.col; ch.fromRow = ch.row;
  if (willLand !== 'miss') {
    ch.toCol = nextP.col;
    ch.toRow = nextP.row;
  } else {
    ch.toCol = ch.col + d.dc * actualDist;
    ch.toRow = ch.row + d.dr * actualDist;
  }
  ch.willLand = willLand;
  ch.jumpDist = actualDist;
  ch.targetDist = targetDist;
  ch.jumpFrames = Math.round(25 + Math.max(actualDist, targetDist) * 8);
  ch.jumping = true;
  ch.jumpT = 0;
  state = 'jumping';
}
function landed() {
  if (ch.willLand === 'miss') {
    dieJump();
    return;
  }
  ch.col = ch.toCol; ch.row = ch.toRow;
  ch.jumping = false; ch.jumpZ = 0; ch.jumpT = 0;
  ch.sqX = 1; ch.sqY = 1;
  ch.landImpact = 1;
  lastDir = chosenDir;
  if (ch.willLand === 'center') {
    playSound('perfect');
    comboCount++;
    const gain = Math.pow(2, Math.min(comboCount, 10));
    score += gain;
    spawnScorePopup(gain);
  } else {
    playSound('land');
    comboCount = 0;
    score += 1;
    spawnScorePopup(1);
  }
  spawnLandParts();
  const ci = Math.floor(score / 100) % CITIES.length;
  if (ci !== cityIndex) { cityIndex = ci; cityFade = 0; spawnCityTransitionPopup(CITIES[ci].name); }
  const charIdx = indexOfChar();
  if (charIdx > 3) {
    const removed = plats.splice(0, charIdx - 2);
    for (const p of removed) occupiedCells.delete(p.col + ',' + p.row);
  }
  ensureAhead();
  if (score > best) { best = score; saveBest(best); }
  chosenDir = null; chargeT = 0;
  state = 'ready';
}
function dieWrong(dir) {
  const d = DIR[dir];
  ch.jumping = false;
  ch.dying = true; ch.dieFall = 0; ch.dieZ = 0;
  ch.dieVX = isoX(d.dc, d.dr) * 0.06;
  ch.dieVY = 1;
  spawnDeathParts();
  state = 'dead'; deadFrames = 0;
}
function dieJump() {
  playSound('miss');
  ch.jumping = false;
  ch.dying = true; ch.dieFall = 0; ch.dieZ = 0;
  ch.dieVX = (Math.random() - 0.5) * 4;
  ch.dieVY = 1;
  spawnDeathParts();
  state = 'dead'; deadFrames = 0;
}

// ===================== UPDATE =====================
function update() {
  camCol += (ch.col - camCol) * 0.1;
  camRow += (ch.row - camRow) * 0.1;

  // 人物起跳过高时让整个游戏世界向下平移，确保模型完整留在屏幕内
  const baseCharacterY = H * 0.42 + isoY(ch.col, ch.row) - camIsoY() - TILE_Z;
  const characterTopWithoutCamera = baseCharacterY - ch.jumpZ - CHARACTER_MODEL_HEIGHT * WORLD_SCALE;
  const safeTop = Math.max(20, 24 * SCALE);
  const desiredJumpCameraY = ch.jumping ? Math.max(0, safeTop - characterTopWithoutCamera) : 0;
  if (desiredJumpCameraY > jumpCameraY) {
    // 上升时即时锁住安全线，避免任何一帧越出屏幕
    jumpCameraY = desiredJumpCameraY;
  } else {
    // 下落与落地后平滑回正，避免画面突然弹回
    jumpCameraY += (desiredJumpCameraY - jumpCameraY) * 0.16;
  }
  if (!ch.jumping && Math.abs(jumpCameraY) < 0.1) jumpCameraY = 0;

  if (cityFade < 1) cityFade = Math.min(1, cityFade + 1 / 30);
  if (nextCityPopup.life > 0) nextCityPopup.life -= 0.015;
  if (state === 'charge' && charging) {
    chargeT = Math.min(1, chargeT + (1 / 60) / 1.8);
    ch.sqY = 1 - chargeT * 0.28;
    ch.sqX = 1 + chargeT * 0.2;
    if (chargeT >= 0.95) { charging = false; startJump(); }
  }
  if (state !== 'jumping' && ch.landImpact > 0) {
    ch.landImpact = Math.max(0, ch.landImpact - 1 / 10);
  }
  if (state === 'jumping' && ch.jumping) {
    const frames = ch.jumpFrames || 45;
    ch.jumpT = Math.min(1, ch.jumpT + 1 / frames);
    const t = ch.jumpT;
    ch.col = ch.fromCol + (ch.toCol - ch.fromCol) * t;
    ch.row = ch.fromRow + (ch.toRow - ch.fromRow) * t;
    ch.jumpZ = Math.sin(Math.PI * t) * TILE_Z * Math.max(ch.jumpDist || 1, ch.targetDist || 1) * 0.8;
    if (ch.jumpT >= 1) landed();
  }
  if (state === 'dead' && ch.dying) {
    deadFrames++;
    ch.dieFall += 1;
    ch.dieVY += 0.6;
    ch.dieZ += ch.dieVY;
  } else if (state === 'dead') {
    deadFrames++;
  }
  updateParts();
  updatePopups();
}

function drawLandmarkSilhouettes(city) {
  ctx.save();

  for (let i = 0; i < 5; i++) landmarks.push({ x: parallax + i * 500 * SCALE, i: i });

  for (const lm of landmarks) {
    const x = lm.x + (lm.i * 500) * SCALE;
    if (x < -250 * SCALE || x > W + 250 * SCALE) continue;

    if (city.name === '宜昌') {
      // 三峡大坝 - 超级详细版
      // 远景山体（深色）
      ctx.fillStyle = '#4a6a7a';

      ctx.lineTo(x - 60 * SCALE, baseY - 100 * SCALE);
      ctx.lineTo(x - 30 * SCALE, baseY);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x + 30 * SCALE, baseY);
      ctx.lineTo(x + 60 * SCALE, baseY - 100 * SCALE);
      ctx.lineTo(x + 100 * SCALE, baseY - 90 * SCALE);
      ctx.lineTo(x + 120 * SCALE, baseY);
      ctx.closePath();

      // 楼3（右侧）
      ctx.fillStyle = '#3a5a8a';
      ctx.fillRect(x + 10 * SCALE, baseY - 105 * SCALE, 35 * SCALE, 105 * SCALE);

      // 楼3窗户
      ctx.fillStyle = '#88ccff';
      ctx.globalAlpha = 0.08 * cityFade;
      for (let wy = baseY - 95 * SCALE; wy < baseY - 10 * SCALE; wy += 12 * SCALE) {
        for (let wx = x + 13 * SCALE; wx < x + 38 * SCALE; wx += 10 * SCALE) {
          ctx.fillRect(wx, wy, 6 * SCALE, 6 * SCALE);
        }
      }
      ctx.globalAlpha = 0.12 * cityFade;

      // 楼4（远右）
      ctx.fillStyle = '#4a6a9a';
      ctx.fillRect(x + 55 * SCALE, baseY - 140 * SCALE, 35 * SCALE, 140 * SCALE);

      // 楼4窗户
      ctx.fillStyle = '#88ccff';
      ctx.globalAlpha = 0.08 * cityFade;
      for (let wy = baseY - 130 * SCALE; wy < baseY - 10 * SCALE; wy += 12 * SCALE) {
        for (let wx = x + 58 * SCALE; wx < x + 83 * SCALE; wx += 10 * SCALE) {
          ctx.fillRect(wx, wy, 6 * SCALE, 6 * SCALE);
        }
      }
      ctx.globalAlpha = 0.12 * cityFade;

      // 楼间空隙显示深度
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1 * SCALE;
      ctx.beginPath();
      ctx.moveTo(x - 50 * SCALE, baseY - 100 * SCALE);
      ctx.lineTo(x - 50 * SCALE, baseY);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(x + 50 * SCALE, baseY - 120 * SCALE);
      ctx.lineTo(x + 50 * SCALE, baseY);
      ctx.stroke();

    } else {
      // 默认通用设计
      ctx.fillStyle = city.glow;
      ctx.fillRect(x - 25 * SCALE, baseY - 100 * SCALE, 50 * SCALE, 100 * SCALE);
    }
  }
  ctx.restore();
}

function drawBg(city) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, city.sky[0]);
  g.addColorStop(1, city.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const horizon = H * 0.5;
  const gg = ctx.createLinearGradient(0, horizon - 80 * SCALE, 0, horizon + 80 * SCALE);
  gg.addColorStop(0, 'rgba(0,0,0,0)');
  gg.addColorStop(0.5, city.glow);
  gg.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.globalAlpha = 0.25 * cityFade;
  ctx.fillStyle = gg; ctx.fillRect(0, horizon - 80 * SCALE, W, 160 * SCALE);
  ctx.globalAlpha = 1;
  drawAuthenticSkyline(city);
  ctx.save();
  ctx.globalAlpha = 0.10 * cityFade;
  ctx.fillStyle = '#ffffff';
  ctx.font = '700 ' + (110 * SCALE) + 'px sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(city.name, W / 2, H * 0.22);
  ctx.restore();
  const gs = ctx.createLinearGradient(0, H * 0.75, 0, H);
  gs.addColorStop(0, 'rgba(0,0,0,0)');
  gs.addColorStop(1, city.ground);
  ctx.fillStyle = gs; ctx.fillRect(0, H * 0.75, W, H * 0.25);
}

function drawScene(city) {
  const list = [];
  for (const p of plats) list.push({ depth: p.col + p.row, kind: 'plat', p: p });
  list.push({ depth: ch.col + ch.row + 0.01, kind: 'char' });
  list.sort((a, b) => a.depth - b.depth);
  const idx = indexOfChar();
  const nextP = plats[idx + 1];
  for (const item of list) {
    if (item.kind === 'plat') {
      const p = item.p;
      const s = projectToScreen(p.col, p.row);
      if (s.x < -TILE_W * 2 || s.x > W + TILE_W * 2 || s.y < -TILE_Z * 6 || s.y > H + TILE_Z * 3) continue;
      const top = city.ground;
      drawCube(ctx, s.x, s.y - TILE_H / 2, TILE_W, TILE_H, TILE_Z, top, shade(top, -28), shade(top, -52));
      if (state === 'ready' && p === nextP) {
        ctx.save();
        ctx.globalAlpha = 0.45 + 0.25 * Math.sin(Date.now() / 250);
        ctx.strokeStyle = city.accent; ctx.lineWidth = 3 * SCALE;
        const sy = s.y - TILE_H / 2;
        ctx.beginPath();
        ctx.moveTo(s.x, sy);
        ctx.lineTo(s.x + TILE_W/2, sy + TILE_H/2);
        ctx.lineTo(s.x, sy + TILE_H);
        ctx.lineTo(s.x - TILE_W/2, sy + TILE_H/2);
        ctx.closePath(); ctx.stroke();
        ctx.restore();
      }
    } else {
      const s = projectToScreen(ch.col, ch.row);
      let py = s.y - ch.jumpZ;
      if (ch.dying) {
        py += ch.dieZ;
      }

      // 阴影随跳跃高度缩小、变淡，强化腾空感
      const shadowLift = Math.max(0, Math.min(1, ch.jumpZ / Math.max(TILE_Z * 3, 1)));
      const shadowScale = 1 - shadowLift * 0.38;
      ctx.save();
      ctx.globalAlpha = ch.dying ? 0 : 0.27 * (1 - shadowLift * 0.62);
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(
        s.x,
        s.y - TILE_H / 2,
        TILE_W * 0.3 * shadowScale,
        TILE_H * 0.2 * shadowScale,
        0, 0, Math.PI * 2
      );
      ctx.fill();
      ctx.restore();

      // 绘制3D人物
      let scaleX = 1, scaleY = 1;
      if (state === 'charge') {
        scaleX = ch.sqX;
        scaleY = ch.sqY;
      }
      drawCharacter3D(s.x + (ch.dying ? ch.dieVX * ch.dieFall : 0), py, 0, scaleX, scaleY);
    }
  }
  drawParts();
  drawPopups();
}

  hairLock( 4.8, 39.2, 3.4, 24, 2.55,  0.11, hair);
  hairLock( 2.9, 43.3, 4.2, 17, 1.75,  0.07, hairWarm);
  // 两片斜刘海
  const bangL = addMesh(new T.SphereGeometry(4.2, 16, 10), hair, modelGroup3D, -2.45, 53.1, 3.0, 0, 0.12, -0.32);
  bangL.scale.set(0.55, 1.15, 0.34);
  const bangR = addMesh(new T.SphereGeometry(4.4, 16, 10), hairWarm, modelGroup3D, 2.35, 53.0, 3.15, 0, -0.12, 0.32);

  // ----- 浅粉色宽松球衣 -----

  // 胸前 lemanism 字样，直接取自参考服装特征

  function makeArm(side) {

  characterRig3D = {
    leftArm: makeArm(-1),

  };

  characterRoot3D.visible = false;

}

function renderCharacter3D() {
  if (!character3DReady || !renderer3D) return;

  characterRoot3D.visible = characterPose3D.visible;
  character3DCanvas.style.opacity = (state === 'start' || state === 'dead') ? '0.48' : '1';

  if (characterPose3D.visible) {
    characterRoot3D.position.set(
      characterPose3D.sx - W / 2,
      H / 2 - characterPose3D.sy,
      0
    );
    characterRoot3D.scale.set(
      WORLD_SCALE * characterPose3D.scaleX,
      WORLD_SCALE * characterPose3D.scaleY,
      WORLD_SCALE
    );

    flipPivot3D.quaternion.identity();
    modelGroup3D.rotation.y = 0;
    characterRig3D.leftArm.rotation.x = 0;
    characterRig3D.rightArm.rotation.x = 0;
    characterRig3D.leftLeg.rotation.x = 0;
    characterRig3D.rightLeg.rotation.x = 0;

    if (state === 'jumping') {
      const t = Math.max(0, Math.min(1, ch.jumpT));
      const flipProgress = t * t * (3 - 2 * t);
      const dx = isoX(ch.toCol - ch.fromCol, ch.toRow - ch.fromRow);
      const dy = -isoY(ch.toCol - ch.fromCol, ch.toRow - ch.fromRow);
      const axis = new THREE.Vector3(dy, -dx, 0);
      if (axis.lengthSq() < 0.0001) axis.set(1, 0, 0);
      axis.normalize();
      flipPivot3D.setRotationFromAxisAngle(axis, Math.PI * 2 * flipProgress);

      const heading = Math.atan2(dx, Math.max(1, Math.abs(dy)));
      modelGroup3D.rotation.y = Math.max(-0.5, Math.min(0.5, heading * 0.45));

      // 翻转中段收紧四肢，让动作更像主动前空翻
      const tuck = Math.sin(Math.PI * t);
      characterRig3D.leftArm.rotation.x = -1.05 * tuck;
      characterRig3D.rightArm.rotation.x = -1.05 * tuck;
      characterRig3D.leftLeg.rotation.x = 1.15 * tuck;
      characterRig3D.rightLeg.rotation.x = 1.15 * tuck;
    } else if (ch.dying) {
      flipPivot3D.rotation.z = Math.min(1.5, ch.dieFall * 0.035);
      modelGroup3D.rotation.y = Math.sin(ch.dieFall * 0.08) * 0.55;
    }
  }

  renderer3D.render(scene3D, camera3D);
}

function drawCharacter2DFallback(sx, sy, scaleX, scaleY) {
  if (!charImg.complete) return;
  const imgW = charImg.naturalWidth ? 22.5 * WORLD_SCALE : (charImg.width || 45 * WORLD_SCALE);
  const ratio = charImg.naturalWidth ? charImg.naturalHeight / charImg.naturalWidth : 2;
  const imgH = imgW * ratio;
  let flipAngle = 0;

  if (state === 'jumping') {
    const t = Math.max(0, Math.min(1, ch.jumpT));
    const flipProgress = t * t * (3 - 2 * t);
    const screenTravelX = isoX(ch.toCol - ch.fromCol, ch.toRow - ch.fromRow);
    flipAngle = (screenTravelX >= 0 ? 1 : -1) * Math.PI * 2 * flipProgress;
  }

  ctx.save();
  ctx.translate(sx, sy - imgH * 0.5);
  ctx.rotate(flipAngle);
  ctx.scale(scaleX, scaleY);
  ctx.drawImage(charImg, -imgW / 2, -imgH / 2, imgW, imgH);
  ctx.restore();
}

function drawCharacter3D(sx, sy, sz, scaleX, scaleY) {
  let finalScaleX = scaleX, finalScaleY = scaleY;

  if (state === 'jumping') {
    const t = Math.max(0, Math.min(1, ch.jumpT));
    const tuck = Math.sin(Math.PI * t);
    finalScaleX *= 1 + tuck * 0.05;
    finalScaleY *= 1 - tuck * 0.08;
  } else if (ch.landImpact > 0) {
    finalScaleX *= 1 + ch.landImpact * 0.16;
    finalScaleY *= 1 - ch.landImpact * 0.16;
  }

  if (!character3DReady) {
    drawCharacter2DFallback(sx, sy, finalScaleX, finalScaleY);
    return;
  }

  characterPose3D.visible = true;
  characterPose3D.sx = sx;
  characterPose3D.sy = sy;
  characterPose3D.scaleX = finalScaleX;
  characterPose3D.scaleY = finalScaleY;
}

function spawnCityTransitionPopup(cityName) {
  nextCityPopup = { text: '到达 ' + cityName, life: 1.0 };
}

function drawCityTransitionPopup() {
  if (nextCityPopup.life <= 0) return;
  ctx.save();
  ctx.globalAlpha = nextCityPopup.life;
  ctx.fillStyle = '#ffcc00';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (32 * SCALE) + 'px sans-serif';
  ctx.fillText(nextCityPopup.text, W / 2, H * 0.25);
  ctx.restore();
}

function drawUI(city) {
  ctx.save();
  ctx.textAlign = 'right'; ctx.textBaseline = 'top';
  ctx.fillStyle = '#fff';
  ctx.font = '700 ' + (34 * SCALE) + 'px sans-serif';
  ctx.fillText(String(score), W - 20, 18);
  ctx.font = '600 ' + (16 * SCALE) + 'px sans-serif';
  ctx.fillStyle = city.accent;
  ctx.fillText(city.name + '  ·  最高 ' + best, W - 20, 18 + 40 * SCALE);
  if (comboCount > 0) {
    ctx.font = '700 ' + (18 * SCALE) + 'px sans-serif';
    ctx.fillStyle = '#ffd700';
    const nextGain = Math.pow(2, Math.min(comboCount + 1, 10));
    ctx.fillText('连击 ×' + comboCount + '  下次 +' + nextGain, W - 20, 18 + 64 * SCALE);
  }
  ctx.restore();
  if (state === 'charge') {
    const bw = Math.min(W * 0.6, 320 * SCALE);
    const bx = (W - bw) / 2, by = H - 110 * SCALE, bh = 12 * SCALE;
    const nextDist = nextDistOf();
    const tgt = (nextDist - 2) / 3;
    const successHalf = 0.5 / 3;
    const centerHalf  = 0.2 / 3;
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,.15)';
    roundRect(bx, by, bw, bh, bh / 2); ctx.fill();
    const szL = Math.max(0, tgt - successHalf);
    const szR = Math.min(1, tgt + successHalf);
    ctx.fillStyle = 'rgba(80,255,140,.35)';
    ctx.fillRect(bx + bw * szL, by, bw * (szR - szL), bh);
    const czL = Math.max(0, tgt - centerHalf);
    const czR = Math.min(1, tgt + centerHalf);
    ctx.fillStyle = 'rgba(255,215,0,.55)';
    ctx.fillRect(bx + bw * czL, by, bw * (czR - czL), bh);
    const delta = Math.abs(chargeT - tgt);
    let fillColor;
    if (delta <= centerHalf) fillColor = '#ffd700';
    else if (delta <= successHalf) fillColor = '#5fffb0';
    else fillColor = '#ff7a7a';
    roundRect(bx, by, Math.max(bh, bw * chargeT), bh, bh / 2);
    ctx.fillStyle = fillColor; ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2 * SCALE;
    ctx.globalAlpha = 0.9;
    ctx.beginPath();
    ctx.moveTo(bx + bw * tgt, by - 3 * SCALE);
    ctx.lineTo(bx + bw * tgt, by + bh + 3 * SCALE);
    ctx.stroke();
    ctx.restore();
  }
  if (state === 'start') {
    overlay();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '700 ' + (44 * SCALE) + 'px sans-serif';
    ctx.fillText('跳一跳 · 城市之旅', W / 2, H * 0.40);
    ctx.font = '500 ' + (20 * SCALE) + 'px sans-serif';
    ctx.fillStyle = '#cde';
    ctx.fillText('点击任意处开始', W / 2, H * 0.40 + 50 * SCALE);
    ctx.fillText('按住蓄力 → 松手起跳', W / 2, H * 0.40 + 84 * SCALE);
  }
  if (state === 'dead') {
    overlay();
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = '700 ' + (48 * SCALE) + 'px sans-serif';
    ctx.fillText('GAME OVER', W / 2, H * 0.38);
    ctx.font = '600 ' + (26 * SCALE) + 'px sans-serif';
    ctx.fillText('得分 ' + score + '   最高 ' + best, W / 2, H * 0.38 + 50 * SCALE);
    if (deadFrames > 55) {
      ctx.font = '500 ' + (20 * SCALE) + 'px sans-serif';
      ctx.fillStyle = '#cde';
      ctx.fillText('点击重新开始', W / 2, H * 0.38 + 96 * SCALE);
    }
  }
}
function overlay() {
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.45)';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ===================== PARTICLES =====================
function spawnLandParts() {
  const s = projectToScreen(ch.toCol, ch.toRow);
  for (let i = 0; i < 16; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 3) * SCALE;
    parts.push({ x: s.x, y: s.y - TILE_H / 2, vx: Math.cos(a) * sp, vy: -Math.abs(Math.sin(a) * sp) - 1,
      life: 1, color: cur().accent, size: (3 + Math.random() * 3) * SCALE });
  }
}
function spawnDeathParts() {
  const s = projectToScreen(ch.col, ch.row);
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 5) * SCALE;
    parts.push({ x: s.x, y: s.y - 20 * SCALE, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2,
      life: 1, color: '#ff6a6a', size: (3 + Math.random() * 4) * SCALE });
  }
}
function spawnScorePopup(gain) {
  const s = projectToScreen(ch.toCol, ch.toRow);
  popups.push({
    x: s.x,
    y: s.y - TILE_Z * 2,
    vy: -1.8 * SCALE,
    life: 1.0,
    text: '+' + gain,
    color: gain > 1 ? '#ffd700' : '#ffffff',
  });
}
function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.18 * SCALE; p.life -= 0.025; }
  parts = parts.filter(p => p.life > 0);
}
function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}
function updatePopups() {
  for (const p of popups) { p.y += p.vy; p.life -= 0.022; }
  popups = popups.filter(p => p.life > 0);
}
function drawPopups() {
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '700 ' + (22 * SCALE) + 'px sans-serif';
  for (const p of popups) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

// ===================== STORAGE =====================
function loadBest() { try { return parseInt(localStorage.getItem('jump3d_best') || '0', 10) || 0; } catch (e) { return 0; } }
function saveBest(v) { try { localStorage.setItem('jump3d_best', String(v)); } catch (e) {} }

// ===================== SOUND =====================
function playSound(type) {
  try {
    const audioCtx = window.audioCtx || (window.audioCtx = new (window.AudioContext || window.webkitAudioContext)());
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'jump') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
      osc.start(now);
      osc.stop(now + 0.15);
    } else if (type === 'perfect') {
      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc1.connect(gain);
      osc2.connect(gain);
      gain.connect(audioCtx.destination);
      osc1.frequency.setValueAtTime(500, now);
      osc2.frequency.setValueAtTime(750, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
      osc1.start(now);
      osc2.start(now);
      osc1.stop(now + 0.3);
      osc2.stop(now + 0.3);
    } else if (type === 'land') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(400, now);
      osc.frequency.exponentialRampToValueAtTime(200, now + 0.12);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
      osc.start(now);
      osc.stop(now + 0.12);
    } else if (type === 'miss') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(600, now);
      osc.frequency.exponentialRampToValueAtTime(100, now + 0.4);
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
      osc.start(now);
      osc.stop(now + 0.4);
    }
  } catch (e) {}
}

// ===================== MAIN LOOP =====================
function draw() {
  characterPose3D.visible = false;
  ctx.clearRect(0, 0, W, H);
  const city = cur();
  drawBg(city);
  drawScene(city);
  drawUI(city);
  drawCityTransitionPopup();
  renderCharacter3D();
}
function tick() {
  update();
  draw();
  requestAnimationFrame(tick);
}

// ===================== INIT =====================
initCharacter3D();
resize();
reset();
tick();
</script>
